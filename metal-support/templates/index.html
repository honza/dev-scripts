<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <title>Metal Wall</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/style.css">
    </head>
    <body class="bg-slate-100 font-mono">
        <div class="bg-white mb-1 h-10">
            <h1 class="text-lg p-3">Metal Wall</h1>
        </div>

        <div class="flex flex-row items-stretch gap-4 w-full p-3">
            {{ range $version, $builds := .Builds }}
                    <div class="p-8 bg-white rounded-lg shadow-lg font-mono">
                        <h1 class="text-center font-bold text-4xl text-slate-600 mb-10">{{ $version }}</h1>
                        <div class="text-sm grid grid-cols-2 gap-2">
                            {{ range $builds }}
                                {{ if .Passed }}
                                    <div class="p-1 px-3 border-2 rounded-lg bg-green-400 hover:bg-green-300 border-green-600">
                                {{ else }}
                                    <div class="p-1 px-3 border-2 rounded-lg bg-red-400 hover:bg-red-300 border-red-600">
                                {{ end }}
                                        <a href="{{ .Url }}">{{ .JobName }}</a>
                                    </div>
                            {{ end }}
                        </div>
                    </div>
            {{ end }}
        </div>

        <div class="text-xs text-center text-slate-400 mt-10">
            <p>Last updated 2022-02-16 13:01:86</p>
        </div>
    </body>
</html>
